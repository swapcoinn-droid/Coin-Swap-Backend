openapi: 3.0.3
info:
  title: Swap Coin API
  description: |
    REST API para la billetera digital de Swap Coin. Soporta balances en múltiples monedas (COP, USD, EUR),
    tasas de cambio en tiempo real, historial de transacciones y metas de ahorro.
  version: 1.0.0
  contact:
    name: Swap Coin Backend

servers:
  - url: http://localhost:3000/api
    description: Server de desarrollo local
  - url: https://coin-swap-backend-production.up.railway.app/api
    description: Server de producción (Railway)

tags:
  - name: Auth
    description: Registro e inicio de sesión de usuarios
  - name: Rates
    description: Tasas de cambio en tiempo real
  - name: Wallet
    description: Saldos, depósitos, retiros y cambio de divisas
  - name: Goals
    description: Gestión de metas de ahorro

# Reusable components
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # Generic
    Error:
      type: object
      properties:
        error:
          type: string
          example: Credenciales inválidas
        status:
          type: integer
          example: 401

    Pagination:
      type: object
      properties:
        total:
          type: integer
          example: 42
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 10
        totalPages:
          type: integer
          example: 5
        hasNextPage:
          type: boolean
          example: true
        hasPrevPage:
          type: boolean
          example: false

    # Auth
    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          example: María García
        email:
          type: string
          format: email
          example: maria@example.com
        password:
          type: string
          minLength: 6
          example: secret123

    RegisterResponse:
      type: object
      properties:
        id:
          type: integer
          example: 7
        name:
          type: string
          example: María García
        email:
          type: string
          example: maria@example.com
        created_at:
          type: string
          format: date-time
          example: "2025-06-01T14:23:00Z"

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: maria@example.com
        password:
          type: string
          example: secret123

    LoginResponse:
      type: object
      properties:
        token:
          type: string
          description: JWT valido por 24 horas
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        user:
          type: object
          properties:
            id:
              type: integer
              example: 7
            name:
              type: string
              example: María García
            email:
              type: string
              example: maria@example.com

    # Rates
    RatesResponse:
      type: object
      properties:
        base:
          type: string
          example: USD
        rates:
          type: object
          properties:
            USD:
              type: number
              example: 1
            COP:
              type: number
              example: 4150.50
            EUR:
              type: number
              example: 0.92
        updatedAt:
          type: string
          format: date-time
          example: "2025-06-01T15:00:00Z"

    # Wallet
    CurrencyCode:
      type: string
      enum: [COP, USD, EUR]
      example: COP

    Balance:
      type: object
      properties:
        currency:
          $ref: "#/components/schemas/CurrencyCode"
        name:
          type: string
          example: Peso colombiano
        symbol:
          type: string
          example: $
        amount:
          type: number
          format: double
          example: 250000.00
        estimatedCOP:
          type: number
          format: double
          example: 250000.00

    WalletResponse:
      type: object
      properties:
        walletId:
          type: integer
          example: 3
        balances:
          type: array
          items:
            $ref: "#/components/schemas/Balance"
        totalEstimatedCOP:
          type: number
          format: double
          example: 315400.00

    AmountCurrencyRequest:
      type: object
      required: [amount]
      properties:
        amount:
          type: number
          format: double
          minimum: 0.01
          example: 50000
        currency:
          $ref: "#/components/schemas/CurrencyCode"

    DepositResponse:
      type: object
      properties:
        currency:
          $ref: "#/components/schemas/CurrencyCode"
        deposited:
          type: number
          example: 50000
        newBalance:
          type: number
          example: 300000

    WithdrawResponse:
      type: object
      properties:
        currency:
          $ref: "#/components/schemas/CurrencyCode"
        withdrawn:
          type: number
          example: 20000
        newBalance:
          type: number
          example: 280000

    ExchangeRequest:
      type: object
      required: [from, to, amount]
      properties:
        from:
          $ref: "#/components/schemas/CurrencyCode"
        to:
          $ref: "#/components/schemas/CurrencyCode"
        amount:
          type: number
          format: double
          minimum: 0.01
          example: 100

    ExchangeResponse:
      type: object
      properties:
        from:
          type: object
          properties:
            currency:
              $ref: "#/components/schemas/CurrencyCode"
            debited:
              type: number
              example: 100
        to:
          type: object
          properties:
            currency:
              $ref: "#/components/schemas/CurrencyCode"
            credited:
              type: number
              example: 415050
        appliedRate:
          type: number
          example: 4150.50

    Transaction:
      type: object
      properties:
        id:
          type: integer
          example: 18
        type:
          type: string
          enum: [deposit, withdrawal, exchange]
          example: exchange
        amount:
          type: number
          example: 100
        currency:
          type: string
          example: USD
        currencySymbol:
          type: string
          example: $
        targetCurrency:
          type: string
          nullable: true
          example: COP
        targetCurrencySymbol:
          type: string
          nullable: true
          example: $
        exchangeRate:
          type: number
          nullable: true
          example: 4150.50
        description:
          type: string
          example: Exchange 100 USD → 415050 COP
        createdAt:
          type: string
          format: date-time

    TransactionsResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Transaction"
        pagination:
          $ref: "#/components/schemas/Pagination"

    # Goals
    Goal:
      type: object
      properties:
        id:
          type: integer
          example: 5
        name:
          type: string
          example: Viaje a Europa
        currency:
          type: string
          example: USD
        currencySymbol:
          type: string
          example: $
        targetAmount:
          type: number
          example: 3000
        currentAmount:
          type: number
          example: 750
        progress:
          type: number
          description: Percentage 0–100
          example: 25.00
        targetDate:
          type: string
          format: date
          nullable: true
          example: "2026-07-01"
        status:
          type: string
          enum: [active, completed, cancelled]
          example: active
        createdAt:
          type: string
          format: date-time

    GoalsResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Goal"
        pagination:
          $ref: "#/components/schemas/Pagination"

    CreateGoalRequest:
      type: object
      required: [name, targetAmount]
      properties:
        name:
          type: string
          example: Viaje a Europa
        targetAmount:
          type: number
          minimum: 0.01
          example: 3000
        currency:
          $ref: "#/components/schemas/CurrencyCode"
        targetDate:
          type: string
          format: date
          nullable: true
          example: "2026-07-01"

    UpdateGoalRequest:
  type: object
  description: Todos los campos son opcionales; envía solo los que desees cambiar.
  properties:
    name:
      type: string
      example: Viaje a Japón
    targetAmount:
      type: number
      minimum: 0.01
      example: 4000
      description: No puede ser menor al monto ya ahorrado.
    targetDate:
      type: string
      format: date
      nullable: true
      example: "2027-03-15"

    ContributeWithdrawRequest:
      type: object
      required: [amount]
      properties:
        amount:
          type: number
          format: double
          minimum: 0.01
          example: 250

    GoalActionResponse:
      type: object
      properties:
        id:
          type: integer
          example: 5
        name:
          type: string
          example: Viaje a Europa
        targetAmount:
          type: number
          example: 3000
        currentAmount:
          type: number
          example: 1000
        progress:
          type: number
          example: 33.33
        status:
          type: string
          example: active
        completed:
          type: boolean
          example: false

  # Reusable parameters
  parameters:
    PageParam:
      in: query
      name: page
      schema:
        type: integer
        minimum: 1
        default: 1
      description: Número de página
    LimitParam:
      in: query
      name: limit
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
      description: Número de items por página
    GoalId:
      in: path
      name: id
      required: true
      schema:
        type: integer
      description: ID de la meta

  # Reusable responses
  responses:
    Unauthorized:
      description: Falta de token o JWT inválido
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: Token requerido
            status: 401
    BadRequest:
      description: Error de validación
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: Límite de peticiones excedido
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: Demasiadas peticiones, intenta de nuevo en 15 minutos
            status: 429

# Paths
paths:

  # Auth 
  /auth/register:
    post:
      tags: [Auth]
      summary: Registro de un nuevo usuario
      description: |
        Crea una cuenta de usuario, una billetera y entradas de saldo cero para cada moneda admitida (COP, USD, EUR). 
        Tasa limitada a **10 solicitudes / 15 min**.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Usuario creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: Email ya tiene una cuenta asociada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: El email ya está en uso
                status: 409
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/login:
    post:
      tags: [Auth]
      summary: Autenticación y recibo de JWT
      description: |
        Valida las credenciales y retorna un **JWT válido por 24 horas**.
        Tasa limitada a **10 solicitudes / 15 min**.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login exitoso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Credenciales inválidas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  # Rates
  /rates:
    get:
      tags: [Rates]
      summary: Obtiene las tasas de cambio actuales
      description: |
        Retorna las tasas de cambio actuales para COP y EUR basadas en USD. Los resultados se almacenan en caché
        por **1 hora** para evitar chocar con la API externa en cada solicitud.
        No requiere autenticación.
      responses:
        "200":
          description: Tasas de cambio
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RatesResponse"

  # Wallet
  /wallet:
    get:
      tags: [Wallet]
      summary: Obtiene los saldos de la billetera
      description: |
        Retorna todos los saldos de las monedas más un **total estimado en COP**
        usando las tasas de cambio actuales.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Datos de la billetera
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /wallet/deposit:
    post:
      tags: [Wallet]
      summary: Deposito de fondos
      description: |
        Agrega fondos a la billetera del usuario. El depósito debe ser mayor a 0 y tener máximo 2 decimales.
        Por defecto, se asume **COP** si no se especifica una moneda.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AmountCurrencyRequest"
            example:
              amount: 50000
              currency: COP
      responses:
        "200":
          description: Deposito exitoso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DepositResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /wallet/withdraw:
    post:
      tags: [Wallet]
      summary: Retira fondos
      description: |
        Retira fondos de la billetera del usuario. El retiro debe ser menor o igual al saldo disponible.
        Retorna **400** si el saldo es insuficiente.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AmountCurrencyRequest"
            example:
              amount: 20000
              currency: COP
      responses:
        "200":
          description: Retiro exitoso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WithdrawResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /wallet/exchange:
    post:
      tags: [Wallet]
      summary: Intercambia entre monedas
      description: |
        Convierte `amount` de la moneda `from` a la moneda `to` a la tasa actual.
        Registra la transacción y un **double-entry ledger** (débito + crédito).
        Tasa limitada a **10 solicitudes / min** por IP.
        `from` y `to` deben ser diferentes.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExchangeRequest"
            example:
              from: USD
              to: COP
              amount: 100
      responses:
        "200":
          description: Intercambio exitoso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExchangeResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /wallet/transactions:
    get:
      tags: [Wallet]
      summary: Lista el historial de transacciones
      description: |
        Retorna una lista paginada de todas las transacciones (depósitos, retiros, intercambios y metas)
        de la billetera del usuario autenticado, ordenadas de la más reciente a la más antigua.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
      responses:
        "200":
          description: Lista de transacciones
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # Goals 
  /goals:
    get:
      tags: [Goals]
      summary: Lista las metas de ahorro
      description: Retorna una lista paginada de todas las metas de ahorro del usuario autenticado, ordenadas de la más reciente a la más antigua.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
      responses:
        "200":
          description: Lista de metas de ahorro
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoalsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

    post:
      tags: [Goals]
      summary: Crea una nueva meta de ahorro
      description: |
        Crea una nueva meta de ahorro asociada a la billetera del usuario autenticado.
        `targetDate` es opcional. Por defecto se usa **COP** si no se especifica `currency`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGoalRequest"
      responses:
        "201":
          description: Meta de ahorro creada exitosamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /goals/{id}/contribute:
    post:
      tags: [Goals]
      summary: Contribuye a una meta de ahorro
      description: |
        Transfiere `amount` desde el saldo de la billetera (en la misma moneda de la meta) hacia la meta.
        Marca automáticamente la meta como **completada** cuando `currentAmount >= targetAmount`.
        Retorna **400** si el saldo es insuficiente o si el monto excede lo que falta para completar la meta.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/GoalId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContributeWithdrawRequest"
      responses:
        "200":
          description: Contribución exitosa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoalActionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /goals/{id}/withdraw:
    post:
      tags: [Goals]
      summary: Retira fondos de una meta de ahorro
      description: |
        Retorna una cantidad `amount` desde la meta hacia el saldo de la billetera (en la misma moneda de la meta).
        No puede exceder el `currentAmount` actual de la meta.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/GoalId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContributeWithdrawRequest"
      responses:
        "200":
          description: Retiro exitoso de la meta de ahorro
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/GoalActionResponse"
                  - type: object
                    properties:
                      withdrawn:
                        type: number
                        example: 250
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /goals/{id}:
    patch:
      tags: [Goals]
      summary: Actualiza una meta de ahorro
      description: |
        Actualiza parcialmente una meta de ahorro activa. Todos los campos del cuerpo de la solicitud son opcionales —
        envía solo los que deseas cambiar. Se requiere al menos un campo.
        El `targetAmount` no puede establecerse por debajo del monto ya ahorrado (`currentAmount`).
        Las metas completadas o canceladas no se pueden editar.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/GoalId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateGoalRequest"
      responses:
        "200":
          description: Meta de ahorro actualizada exitosamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Goals]
      summary: Elimina una meta de ahorro
      description: |
        Elimina permanentemente la meta y devuelve cualquier monto ahorrado a la billetera.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/GoalId"
      responses:
        "200":
          description: Meta eliminada y saldo devuelto
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Meta eliminada, 750 devueltos a tu balance
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
